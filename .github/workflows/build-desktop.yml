name: Build Engine Test Manager (Windows)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows App
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: stable
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Visual Studio 2019 Build Tools
        shell: cmd
        run: |
          choco install visualstudio2019buildtools --params "--includeRecommended --add Microsoft.VisualStudio.Workload.VCTools" -y --no-progress || exit 0
          choco install visualstudio2019-workload-vctools -y --no-progress || exit 0

      - name: Check project
        shell: bash
        run: |
          test -f engine_test_manager/pubspec.yaml
          test -f engine_test_manager/lib/main.dart

      - name: Detect project
        shell: bash
        run: |
          python scripts/detect_project.py --root "$GITHUB_WORKSPACE/engine_test_manager" --output detection.json

      - name: Configure toolchain
        shell: bash
        run: |
          python scripts/setup_environment.py \
            --root "$GITHUB_WORKSPACE/engine_test_manager" \
            --detect detection.json \
            --output toolchain.json
      - name: Generate Windows platform files
        working-directory: engine_test_manager
        run: flutter create --platforms=windows .
      - name: Get Flutter packages
        working-directory: engine_test_manager
        run: flutter pub get

      - name: Build Windows
        working-directory: engine_test_manager
        shell: cmd
        run: flutter build windows --release

      - name: Package application
        shell: bash
        run: |
          BUNDLE_DIR="engine_test_manager/build/windows/x64/runner/Release"
          if [ ! -d "$BUNDLE_DIR" ]; then
            echo "Build output not found!"
            exit 1
          fi
          cd "$BUNDLE_DIR"
          7z a -tzip "$GITHUB_WORKSPACE/engine-test-manager-windows.zip" *

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="engine-test-manager-${{ github.run_id }}"
          gh release create "$TAG" \
            "engine-test-manager-windows.zip" \
            --title "Engine Test Manager Windows" \
            --notes "Windows desktop build"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-manager-build-logs
          path: engine_test_manager/build/
          if-no-files-found: ignore
